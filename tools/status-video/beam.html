<!doctype html><meta charset=utf-8><style>@font-face{font-family:J;src:url('PlusJakartaSansVar.woff2');font-weight:200 900}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style><body><canvas id=c width=1080 height=1000></canvas><script>
const q=new URLSearchParams(location.search);const T=parseFloat(q.get('t'));
const W=1080,H=1000,c=document.getElementById('c'),x=c.getContext('2d');
const cl=(a,b,d)=>Math.min(Math.max(a,b),d),sm=(a,b,v)=>{const u=cl((v-a)/(b-a),0,1);return u*u*(3-2*u)};
const S0=24.55,SD=1.8,tt=T-24.3;
const p=cl((T-S0)/SD,0,1),eP=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,bx=100-eP*100;
// STATE_1 -> STATE_3 beam config (from CanvasFluidLightEngine.tsx), blur scaled to 1080 wide
const lerp=(a,b)=>a+(b-a)*eP,K=0.75;
const spread=lerp(6,73),origin=lerp(69,63),blur=lerp(71,80)*K,bright=lerp(2.2,1.9);
function beam(px,py,sp,og,bl,br,alpha){
 const bw=og/100*W,bh=sp/100*W,b=Math.min(4,Math.max(.2,br)),r=Math.max(bw,bh)*.6;
 x.save();x.globalAlpha=alpha;x.filter=`blur(${bl}px)`;x.globalCompositeOperation='screen';
 const g=x.createRadialGradient(px,py,0,px,py,r);
 g.addColorStop(0,`rgba(255,255,255,${Math.min(1,.95*b)})`);g.addColorStop(.3,`rgba(210,220,240,${Math.min(1,.65*b)})`);
 g.addColorStop(.65,`rgba(140,160,200,${Math.min(1,.3*b)})`);g.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=g;x.beginPath();x.ellipse(px,py,bw/2,bh/2,Math.PI/2,0,Math.PI*2);x.fill();x.restore();}
const _s=document.createElement("span");_s.style.cssText="font:900 20px J;position:absolute;opacity:0";_s.textContent="D'Verse";document.body.appendChild(_s);setTimeout(()=>{try{
 x.fillStyle='#000';x.fillRect(0,0,W,H);
 const fs=227;x.font=`900 ${fs}px J`;x.letterSpacing=(-0.04*fs)+'px';x.textBaseline='alphabetic';
 const full="D'Verse",wD=x.measureText('D').width,wAll=x.measureText(full).width,x0=(W-wAll)/2,cy=500+fs*0.35;
 const px=bx/100*W;
 const lit=(cx)=>{const g=x.createLinearGradient(cx-420,0,cx+420,0);
  g.addColorStop(0,'#46556d');g.addColorStop(.42,'#b9c6dc');g.addColorStop(.5,'#ffffff');g.addColorStop(.58,'#b9c6dc');g.addColorStop(1,'#46556d');return g};
 const settle=sm(26.2,27.4,T); // text brightens to final icy white after the sweep
 // 'Verse: plain fade in
 const aV=sm(0,1.0,tt);
 x.save();x.globalAlpha=aV;
 x.fillStyle=lit(px);x.fillText("'Verse",x0+wD,cy);
 if(settle>0){x.globalAlpha=aV*settle;x.fillStyle='#eef4ff';x.fillText("'Verse",x0+wD,cy)}
 x.restore();
 // D: formed by the beam as it reaches the left edge
 const reach=sm(x0+wD+30,x0-40,px); // 0 when beam far right of D, 1 when it has arrived
 if(reach>0){x.save();x.globalAlpha=reach;x.fillStyle=lit(px);x.fillText('D',x0,cy);
  if(settle>0){x.fillStyle='#eef4ff';x.globalAlpha=reach*settle;x.fillText('D',x0,cy)}x.restore();
  // soft bloom that condenses into the D
  x.save();x.globalAlpha=reach*(.55+.35*sm(26.3,27.6,T));x.filter=`blur(${22*K}px)`;x.globalCompositeOperation='screen';x.fillStyle='#cfe0ff';x.fillText('D',x0,cy);x.restore();}
 // text glow halo once settled (subtle, icy)
 if(settle>0){x.save();x.globalAlpha=settle*.35;x.filter='blur(18px)';x.globalCompositeOperation='screen';x.fillStyle='#bcd2ff';x.fillText(full,x0,cy);x.restore()}
 // beam
 const inA=sm(24.5,24.8,T);
 if(p<1)beam(px,500,spread,origin,blur,bright,inA);
 else{const k=sm(26.35,27.7,T);
  // resting glow starts at the left edge (STATE_3), then condenses into the D
  beam((x0+wD*0.5)*k,500+ (cy-fs*0.35-500)*0+(-fs*0.02)*k,73-38*k,63-26*k,(80-30*k)*K,1.9-0.7*k,1-0.55*k);}
 document.title='ready';
}catch(e){document.body.insertAdjacentHTML("beforeend","<pre style=color:red>ERR "+e+"</pre>")}},300);
</script>

services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: dtunes-pot-provider
    restart: unless-stopped
    init: true

  stream-api:
    build:
      context: ../..
      dockerfile: deploy/stream-backend/Dockerfile
    container_name: dtunes-stream-api
    restart: unless-stopped
    depends_on:
      - pot-provider
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      YTDLP_POT_PROVIDER_URL: http://pot-provider:4416
      YTDLP_JS_RUNTIMES: node

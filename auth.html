<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Signing in | D'Tunes</title>
  <link rel="icon" type="image/svg+xml" href="DTunes.svg">
  <link rel="stylesheet" href="src/css/brand.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      color: #f4f4f5;
      font-family: 'J', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: rgba(24, 24, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeIn 0.4s cubic-bezier(0.2, 0, 0, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .icon-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(120, 180, 255, 0.32);
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.2; }
    }
    .icon-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(120, 180, 255, 0.12);
      border: 1px solid rgba(120, 180, 255, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7cc0ff;
      font-size: 32px;
    }
    .error .pulse-ring { display: none; }
    .error .icon-circle {
      color: #fca5a5;
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.35);
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      color: #a1a1aa;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: filter 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { filter: brightness(0.95); }
    .btn[hidden] { display: none; }
    .hint {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: #71717a;
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <div class="icon-circle" id="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
    </div>
    <h1 id="title">Signed in</h1>
    <p id="desc">Returning you to the D'Tunes app…</p>
    <a id="open-app-btn" class="btn" href="#">Open D'Tunes</a>
    <div class="hint" id="hint">If the app didn't open, tap the button above.</div>
  </main>

  <script>
    (function () {
      var PACKAGE = 'com.dcode9.dtunes';
      var SUPABASE_URL = window.DVERSE_SUPABASE_URL || 'https://gmwieijbrrztukqpfwkg.supabase.co';
      var SUPABASE_ANON_KEY = window.DVERSE_SUPABASE_ANON_KEY || 'sb_publishable_KX3MYtV84QJJdy9bPDuMEA_V99sLKSE';

      var AUTH_START_URL = window.location.origin + '/auth.html?start=1';

      function base64UrlDecode(value) {
        try {
          var normalized = String(value || '').replace(/-/g, '+').replace(/_/g, '/');
          var padded = normalized + '==='.slice((normalized.length + 3) % 4);
          var binary = atob(padded);
          var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0); });
          return JSON.parse(new TextDecoder().decode(bytes));
        } catch (e) {
          return null;
        }
      }

      function base64UrlEncode(value) {
        try {
          var bytes = new TextEncoder().encode(value);
          var binary = '';
          for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        } catch (e) {
          return '';
        }
      }

      var searchParams = new URLSearchParams(window.location.search);
      var hash = window.location.hash ? window.location.hash.replace(/^#\/?/, '') : '';
      var hashParams = new URLSearchParams(hash.charAt(0) === '?' ? hash.slice(1) : hash);

      var allParams = new URLSearchParams();
      searchParams.forEach(function (val, key) { allParams.set(key, val); });
      hashParams.forEach(function (val, key) { allParams.set(key, val); });
      allParams.delete('desktop_auth');

      var card = document.getElementById('card');
      var btn = document.getElementById('open-app-btn');
      var hintEl = document.getElementById('hint');

      function cleanBrowserUrl() {
        // Tokens must not linger in the address bar or browser history. Only run after
        // the values above have been captured so nothing needed for the exchange is lost.
        try { window.history.replaceState(null, document.title, window.location.pathname); } catch (_) {}
      }

      function showError(message) {
        card.classList.add('error');
        document.getElementById('icon').textContent = '!';
        document.getElementById('title').textContent = "Sign-in didn't finish";
        document.getElementById('desc').textContent = message;
        hintEl.textContent = 'Go back to D\'Tunes and tap "Sign In with Google" again.';
        btn.hidden = true;
        cleanBrowserUrl();
      }

      function showRetry(message) {
        showError(message);
        btn.hidden = false;
        btn.textContent = 'Try again';
        btn.href = AUTH_START_URL;
        hintEl.textContent = 'Tap "Try again" to reopen the Google account picker.';
      }

      function startGoogleSignIn() {
        function begin() {
          if (!window.supabase || typeof window.supabase.createClient !== 'function') {
            showRetry('The sign-in service could not be loaded. Check your connection and try again.');
            return;
          }
          document.getElementById('title').textContent = 'Choosing your Google account…';
          document.getElementById('desc').textContent = 'Opening the Google account picker so you can choose which account to use.';
          hintEl.textContent = 'Use the account picker to switch between Google accounts.';
          try {
            var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
              auth: {
                flowType: 'pkce',
                detectSessionInUrl: false,
                persistSession: true,
                autoRefreshToken: false
              }
            });
            supabase.auth.signInWithOAuth({
              provider: 'google',
              options: {
                queryParams: { prompt: 'select_account', access_type: 'online' },
                redirectTo: window.location.origin + '/auth.html',
                skipBrowserRedirect: false
              }
            }).then(function (result) {
              if (result && result.error) showRetry(result.error.message || 'Google sign-in could not be started.');
            }).catch(function (error) {
              showRetry((error && error.message) || 'Google sign-in could not be started.');
            });
          } catch (error) {
            showRetry((error && error.message) || 'Google sign-in could not be started.');
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', begin, { once: true });
        } else {
          begin();
        }
      }

      var providerError = allParams.get('error_description') || allParams.get('error');
      if (providerError) {
        showRetry(providerError.replace(/\+/g, ' '));
        return;
      }

      var dverseSession = allParams.get('dverse_session');
      var decoded = dverseSession ? base64UrlDecode(dverseSession) : null;
      var code = allParams.get('code');
      var accessToken = allParams.get('access_token') || (decoded && decoded.access_token) || null;
      var refreshToken = allParams.get('refresh_token') || (decoded && decoded.refresh_token) || null;
      var expiresIn = allParams.get('expires_in') || (decoded && decoded.expires_in) || null;
      var tokenType = allParams.get('token_type') || (decoded && decoded.token_type) || 'bearer';
      var returnedUserId = (decoded && decoded.user_id) || null;
      var returnedEmail = (decoded && decoded.email) || null;
      var hasReturnedAuth = Boolean(code || accessToken || decoded);

      // Normally ?start=1 launches OAuth. If Supabase fell back to the start URL and still
      // appended a session/code to it, finish that return leg instead of starting over.
      if (searchParams.get('start') === '1' && !hasReturnedAuth) {
        startGoogleSignIn();
        return;
      }

      if (!hasReturnedAuth) {
        showRetry('No session was returned from Google. Please sign in again.');
        return;
      }

      function persistSession(payload) {
        try {
          var serialized = JSON.stringify({
            access_token: payload.access_token,
            refresh_token: payload.refresh_token,
            expires_at: payload.expires_at,
            user_id: payload.user_id || null,
            email: payload.email || null
          });
          localStorage.setItem('dverse_session_cache', serialized);
          localStorage.setItem('dverse_auth_tokens', serialized);
          sessionStorage.setItem('dverse_session_cache', serialized);
        } catch (_) {}
      }

      function completeHandoff(session) {
        if (!session || !session.access_token || !session.refresh_token) {
          showRetry('Google did not return a complete session. Please try again.');
          return;
        }

        var now = Math.floor(Date.now() / 1000);
        var sessionExpiresIn = Number(session.expires_in);
        if (!sessionExpiresIn && session.expires_at) {
          sessionExpiresIn = Math.max(0, Number(session.expires_at) - now);
        }
        if (!sessionExpiresIn || !isFinite(sessionExpiresIn)) sessionExpiresIn = 3600;

        var user = session.user || {};
        var payload = {
          access_token: session.access_token,
          refresh_token: session.refresh_token,
          expires_in: sessionExpiresIn,
          expires_at: session.expires_at || (now + sessionExpiresIn),
          token_type: session.token_type || 'bearer',
          user_id: user.id || returnedUserId || null,
          email: user.email || returnedEmail || null
        };
        persistSession(payload);

        // Desktop (Electron) listener; harmless no-op elsewhere.
        if (!/Android/i.test(navigator.userAgent)) {
          try {
            fetch('http://127.0.0.1:49200/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                access_token: payload.access_token,
                refresh_token: payload.refresh_token,
                expires_in: payload.expires_in,
                token_type: payload.token_type
              })
            }).catch(function () {});
          } catch (_) {}
        }

        // Android imports this base64url session without needing the PKCE verifier.
        // Raw tokens stay too so older app builds and the desktop handoff keep working.
        var handoffParams = new URLSearchParams();
        handoffParams.set('dverse_session', base64UrlEncode(JSON.stringify(payload)));
        handoffParams.set('access_token', payload.access_token);
        handoffParams.set('refresh_token', payload.refresh_token);
        handoffParams.set('expires_in', String(payload.expires_in));
        handoffParams.set('token_type', payload.token_type);

        var qs = handoffParams.toString();
        var dtunesUrl = 'dtunes://auth?' + qs;
        var intentUrl = 'intent://auth?' + qs +
          '#Intent;scheme=dtunes;package=' + PACKAGE +
          ';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
        var primaryUrl = /Android/i.test(navigator.userAgent) ? intentUrl : dtunesUrl;

        btn.href = primaryUrl;
        btn.textContent = "Open D'Tunes";
        document.getElementById('title').textContent = 'Signed in';
        document.getElementById('desc').textContent = "Returning you to the D'Tunes app…";
        hintEl.textContent = 'Signed in with the Google account picker. To switch accounts, sign in again from D\'Tunes. If the app didn\'t open, tap the button above.';

        cleanBrowserUrl();

        var launched = false;
        function launchApp() {
          try { window.location.href = primaryUrl; } catch (_) {}
        }

        // Chrome allows this when it follows the user's tap on the Google account picker.
        // If it's blocked, the button below provides the user gesture it needs.
        launchApp();
        setTimeout(function () { if (!launched) launchApp(); }, 600);

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') launched = true;
        });
      }

      if (accessToken && refreshToken) {
        completeHandoff({
          access_token: accessToken,
          refresh_token: refreshToken,
          expires_in: Number(expiresIn) || null,
          token_type: tokenType,
          user: returnedUserId ? { id: returnedUserId, email: returnedEmail } : null
        });
        return;
      }

      if (code) {
        // The PKCE code verifier lives in this browser's storage, so Supabase must be
        // exchanged here. Android cannot exchange it later.
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          showRetry('The sign-in service could not be loaded. Check your connection and try again.');
          return;
        }
        document.getElementById('title').textContent = 'Finishing sign-in…';
        document.getElementById('desc').textContent = 'Verifying your Google session…';
        try {
          var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
              flowType: 'pkce',
              detectSessionInUrl: false,
              persistSession: true,
              autoRefreshToken: false
            }
          });
          supabase.auth.exchangeCodeForSession(code).then(function (result) {
            if (!result || result.error || !result.data || !result.data.session) {
              showRetry('Google sign-in could not be completed in this browser. Please try again.');
              return;
            }
            completeHandoff(result.data.session);
          }).catch(function () {
            showRetry('Google sign-in could not be completed in this browser. Please try again.');
          });
        } catch (error) {
          showRetry('Google sign-in could not be completed in this browser. Please try again.');
        }
        return;
      }

      showRetry('No session was returned from Google. Please sign in again.');
    })();
  </script>
</body>
</html>

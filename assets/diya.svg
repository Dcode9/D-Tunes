<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" class="detailed-diya-svg">
  <defs>
    <!-- Flame Outer Glow -->
    <filter id="diyaFlameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Drop Shadow -->
    <filter id="diyaShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.45" />
    </filter>

    <!-- Gradients -->
    <radialGradient id="auraGlow" cx="50%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Terracotta / Brass Body Gradient -->
    <linearGradient id="diyaBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="65%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Rim Lip Gradient -->
    <linearGradient id="diyaRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="20%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Oil Pool Gradient -->
    <radialGradient id="diyaOilGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <!-- Outer Flame -->
    <linearGradient id="outerFlameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Inner Core Flame -->
    <linearGradient id="innerFlameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Ambient Pulsing Aura Glow Behind Flame -->
  <circle cx="60" cy="38" r="32" fill="url(#auraGlow)" class="animate-pulse" />

  <!-- Base Shadow / Countertop Glow -->
  <ellipse cx="60" cy="100" rx="36" ry="7" fill="#000000" opacity="0.35" />
  <ellipse cx="60" cy="98" rx="28" ry="4" fill="#f59e0b" opacity="0.3" filter="url(#diyaFlameGlow)" />

  <!-- Diya Pedestal Base -->
  <path d="M46 95 C46 92, 52 90, 60 90 C68 90, 74 92, 74 95 C74 98, 68 100, 60 100 C52 100, 46 98, 46 95 Z" fill="#78350f" />
  <ellipse cx="60" cy="95" rx="13" ry="3" fill="#b45309" stroke="#fde68a" stroke-width="0.75" />

  <!-- Main Terracotta / Brass Diya Body Bowl -->
  <path d="M16 66 C18 84, 38 95, 60 95 C82 95, 102 84, 104 66 C104 64, 100 63, 88 64 C76 65, 66 66, 60 66 C54 66, 44 65, 32 64 C20 63, 16 64, 16 66 Z" 
        fill="url(#diyaBodyGrad)" filter="url(#diyaShadow)" />

  <!-- Traditional Decorative Scalloped Fluting on Diya Belly -->
  <g stroke="#fef3c7" stroke-width="0.8" opacity="0.65" fill="none">
    <path d="M28 72 C36 82, 46 88, 60 90 C74 88, 84 82, 92 72" />
    <path d="M34 76 C42 84, 50 88, 60 89 C70 88, 78 84, 86 76" opacity="0.5" />
    <!-- Vertical decorative rib grooves -->
    <path d="M38 68 C40 76, 44 83, 49 87" />
    <path d="M48 68 C50 76, 53 84, 56 89" />
    <path d="M60 68 L60 90" />
    <path d="M72 68 C70 76, 67 84, 64 89" />
    <path d="M82 68 C80 76, 76 83, 71 87" />
  </g>

  <!-- Ornate Golden Bead Dots along Rim Base -->
  <g fill="#fef08a" opacity="0.9">
    <circle cx="26" cy="67" r="1.2" />
    <circle cx="34" cy="68.2" r="1.3" />
    <circle cx="43" cy="69" r="1.4" />
    <circle cx="52" cy="69.4" r="1.4" />
    <circle cx="60" cy="69.5" r="1.5" />
    <circle cx="68" cy="69.4" r="1.4" />
    <circle cx="77" cy="69" r="1.4" />
    <circle cx="86" cy="68.2" r="1.3" />
    <circle cx="94" cy="67" r="1.2" />
  </g>

  <!-- Top Rim Bevel (Golden Lip of Diya) -->
  <ellipse cx="60" cy="64" rx="44" ry="8" fill="url(#diyaRimGrad)" stroke="#fef3c7" stroke-width="0.75" />

  <!-- Oil Reservoir Pool -->
  <ellipse cx="60" cy="64" rx="38" ry="6" fill="url(#diyaOilGrad)" />
  <ellipse cx="60" cy="64.5" rx="33" ry="4.5" fill="#7c2d12" opacity="0.8" />
  <ellipse cx="60" cy="65" rx="26" ry="3" fill="#ea580c" opacity="0.5" />

  <!-- Diya Wick Tip (Bati) -->
  <path d="M58 64 C58 56, 59 50, 60 46 C61 50, 62 56, 62 64 Z" fill="#451a03" />
  <!-- Charred Wick Tip glowing red -->
  <ellipse cx="60" cy="46" rx="1.5" ry="2" fill="#ef4444" filter="url(#diyaFlameGlow)" />

  <!-- Outer Magnificent Sacred Flame -->
  <path d="M60 12 C67 24, 76 34, 76 45 C76 56, 68 62, 60 62 C52 62, 44 56, 44 45 C44 34, 53 24, 60 12 Z" 
        fill="url(#outerFlameGrad)" filter="url(#diyaFlameGlow)" opacity="0.95" />

  <!-- Middle Vibrant Amber-Gold Flame -->
  <path d="M60 20 C65 28, 71 36, 71 45 C71 53, 66 58, 60 58 C54 58, 49 53, 49 45 C49 36, 55 28, 60 20 Z" 
        fill="#fef08a" opacity="0.9" />

  <!-- Inner Bright White-Hot Pure Flame Core -->
  <path d="M60 27 C63 33, 67 39, 67 46 C67 52, 64 55, 60 55 C56 55, 53 52, 53 46 C53 39, 57 33, 60 27 Z" 
        fill="url(#innerFlameGrad)" />

  <!-- Pure White Tear Core -->
  <ellipse cx="60" cy="45" rx="3.5" ry="7" fill="#ffffff" />

  <!-- Sparkling Festive Light Particles / Embers -->
  <circle cx="72" cy="20" r="1" fill="#fef08a" filter="url(#diyaFlameGlow)" opacity="0.8" />
  <circle cx="78" cy="29" r="1.3" fill="#fbbf24" opacity="0.9" />
  <circle cx="47" cy="22" r="1.1" fill="#fef08a" opacity="0.8" />
  <circle cx="42" cy="33" r="1.4" fill="#f59e0b" opacity="0.75" />
  <circle cx="60" cy="7" r="1.2" fill="#ffffff" filter="url(#diyaFlameGlow)" />

  <!-- Decorative Sparkle Star -->
  <path d="M60 2 L61 5 L64 6 L61 7 L60 10 L59 7 L56 6 L59 5 Z" fill="#ffffff" opacity="0.9" />
</svg>
